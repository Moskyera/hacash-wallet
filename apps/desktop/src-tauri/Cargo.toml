[package]
name = "hacash-wallet"
version.workspace = true
edition.workspace = true
description = "HPAY Wallet. secure desktop app for Hacash"

[lib]
name = "hacash_wallet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hacash-wallet-core = { path = "../../../crates/wallet-core" }
wallet-tauri-common = { path = "../../../crates/wallet-tauri-common", features = ["desktop", "agent-wallet-admin"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Security_Credentials_UI",
    "Foundation",
    # The consent prompt runs on a worker thread, which must join a COM
    # apartment itself before any WinRT activation succeeds.
    "Win32_Foundation",
    "Win32_System_Com",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
agent-wallet-testnet-pilot = ["wallet-tauri-common/agent-wallet-testnet-pilot"]
agent-wallet-bounded-mainnet-pilot = [
    "agent-wallet-testnet-pilot",
    "wallet-tauri-common/agent-wallet-bounded-mainnet-pilot",
]
