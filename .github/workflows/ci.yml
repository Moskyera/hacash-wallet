name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22.17.0"
  YARN_VERSION: "1.22.22"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  rust-quality:
    name: Rust format, lint and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify synchronized release version
        run: node scripts/release-version.mjs check

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Install Linux desktop dependencies for all-feature checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wallet-rust-quality

      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Enforce the exact reviewed Rust advisory policy
        run: |
          node --test scripts/check-rust-advisories.test.mjs
          node scripts/check-rust-advisories.mjs check

      - name: Check Rust formatting
        run: >-
          cargo fmt
          -p hpay-agent-types
          -p hpay-agent-connector
          -p agent-wallet-core
          -p agent-wallet-runtime
          -p hpay-companion-protocol
          -p hpay-companion-lan-runtime
          -p dust-whisper
          -p l2-fast-pay-hub
          -p hacash-wallet-core
          -p wallet-tauri-common
          -p hacash-wallet
          -p hacash-wallet-mobile
          -- --check

      - name: Validate the one-click Fast Pay Hub installer
        run: bash -n scripts/hpay-fast-pay-hub/install.sh

      - name: Create Tauri compile-only frontend fixtures
        run: |
          # generate_context! validates frontendDist; frontend jobs build the real bundles.
          mkdir -p apps/desktop/dist apps/mobile/dist
          printf '%s\n' '<!doctype html><title>CI compile fixture</title>' > apps/desktop/dist/index.html
          cp apps/desktop/dist/index.html apps/mobile/dist/index.html

      - name: Lint Rust workspace with the supported Linux feature set
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude hacash-wallet --locked -- -D warnings
          cargo clippy -p hacash-wallet --all-targets --locked -- -D warnings

      # Every other Rust step here builds with the pilot feature on, so the
      # shape the code claims to preserve - a build where the witness lifecycle
      # is not compiled at all - was never compiled anywhere. A call into a
      # cfg-gated accessor from a `cfg!` branch broke exactly this and reached
      # a desktop release build before anything noticed. It is a check, not a
      # test run: the promise being kept is that it still builds.
      - name: Compile the agent wallet with the pilot lifecycle absent
        run: cargo check -p agent-wallet-core --all-targets --no-default-features --locked

      - name: Test Rust workspace with the supported Linux feature set
        run: |
          cargo test --workspace --all-targets --all-features --exclude hacash-wallet --exclude agent-wallet-core --locked -- --test-threads=1
          cargo test -p hacash-wallet --all-targets --locked -- --test-threads=1

  rust-agent-wallet:
    name: Agent Wallet security and recovery tests
    runs-on: ubuntu-22.04
    # Measured, not guessed. This job runs the suite with
    # --test-threads=1, and most of these tests spawn a pilot node and
    # wait on it, so they cost ~28 seconds each in CI against under 5
    # minutes for the whole suite in parallel on a developer machine.
    # Run 33510020635 got through 255 of 358 tests in 118 minutes and
    # was still progressing normally when the 120-minute cap killed it -
    # nothing hung, the budget simply ran out. 358 at that rate is about
    # 166 minutes, so 120 no longer fits and 180 leaves real headroom.
    #
    # Raising this rather than parallelising because the serial flag is
    # deliberate: these tests bind ports and drive a shared node.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: agent-wallet-security-tests

      - name: Test the Agent Wallet security and recovery boundary
        run: cargo test -p agent-wallet-core --all-targets --all-features --locked -- --test-threads=1

  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [desktop, mobile]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: apps/${{ matrix.app }}/yarn.lock

      - name: Install pinned Yarn
        run: npm install --global yarn@${YARN_VERSION}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: yarn install --frozen-lockfile --non-interactive

      # The style gate reads the BUILT stylesheet of BOTH apps, because "styled
      # on desktop, bare on the phone" is one defect wearing two hats. This job
      # is a matrix over one app at a time, so on a clean runner that gate could
      # never pass: it failed on missing dist rather than on a missing rule, in
      # every run, while reading green locally where both dists happened to
      # exist. Install and build both, and build BEFORE testing, so the gate
      # reads what actually ships instead of reporting the build order.
      - name: Install dependencies for the other app
        working-directory: apps/${{ matrix.app == 'desktop' && 'mobile' || 'desktop' }}
        run: yarn install --frozen-lockfile --non-interactive

      - name: Type-check and build both frontends
        run: |
          yarn --cwd apps/desktop build
          yarn --cwd apps/mobile build

      - name: Run frontend unit tests
        working-directory: apps/${{ matrix.app }}
        run: yarn test

  desktop-compile:
    name: Desktop compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: apps/desktop/yarn.lock

      - name: Install pinned Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: desktop-${{ runner.os }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: yarn install --frozen-lockfile --non-interactive

      - name: Compile Linux desktop with bounded Agent mainnet
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --no-bundle -- --locked --features agent-wallet-bounded-mainnet-pilot

      - name: Compile Windows desktop with bounded Agent mainnet
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --no-bundle -- --locked --features agent-wallet-bounded-mainnet-pilot

  android-compile:
    name: Android arm64 debug compile
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: apps/mobile/yarn.lock

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          rustup target add aarch64-linux-android
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-arm64

      - name: Install pinned Yarn and dependencies
        working-directory: apps/mobile
        run: |
          npm install --global yarn@${YARN_VERSION}
          yarn install --frozen-lockfile --non-interactive

      - name: Initialize generated Android project
        working-directory: apps/mobile
        run: yarn run tauri -- android init --ci

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Create ephemeral CI-only debug signer
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/ci-debug.jks" -storetype JKS \
            -alias ci-debug -storepass ci-debug-password -keypass ci-debug-password \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI Debug, O=Hacash Wallet"
          {
            printf 'password=ci-debug-password\n'
            printf 'keyAlias=ci-debug\n'
            printf 'storeFile=%s\n' "${RUNNER_TEMP}/ci-debug.jks"
          } > apps/mobile/src-tauri/gen/android/keystore.properties

      - name: Build the exact mobile frontend being packaged
        working-directory: apps/mobile
        run: yarn build

      - name: Apply and validate Android integration
        shell: pwsh
        run: ./apps/mobile/apply-android-patches.ps1

      - name: Build Android arm64 debug APK
        working-directory: apps/mobile
        run: node node_modules/@tauri-apps/cli/tauri.js android build --ci --debug --target aarch64 --apk -c tauri.android.build.conf.json -- --locked --features agent-wallet-bounded-mainnet-pilot

      - name: Revalidate Android integration after Tauri regeneration
        shell: pwsh
        run: ./apps/mobile/validate-android-build.ps1

      - name: Verify debug APK version and ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' APKS < <(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -iname '*debug*.apk' -print0)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$VERSION_MAJOR * 10000 + 10#$VERSION_MINOR * 100 + 10#$VERSION_PATCH))
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='org.hacash.wallet.mobile'" <<< "$BADGING" | grep -F "versionName='${VERSION}'" | grep -F "versionCode='${VERSION_CODE}'"
          test "$(grep '^native-code:' <<< "$BADGING")" = "native-code: 'arm64-v8a'"
