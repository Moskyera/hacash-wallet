name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-desktop"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "22.17.0"
  YARN_VERSION: "1.22.22"

jobs:
  build-windows:
    name: Build unsigned Windows x64 artifacts
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      release-version: ${{ steps.release-version.outputs.version }}
    env:
      # Public trust policy compiled into the updater. This is a repository
      # Actions variable, never private signing material.
      WINDOWS_UPDATE_SIGNER_SHA256: ${{ vars.WINDOWS_EXPECTED_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify release version and tag
        id: release-version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/release-version.mjs check
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid desktop release version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate the public Windows signer pin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fingerprint = ($env:WINDOWS_UPDATE_SIGNER_SHA256 -replace "[^0-9A-Fa-f]", "").ToLowerInvariant()
          if ($fingerprint -notmatch "^[0-9a-f]{64}$") {
            throw "Repository variable WINDOWS_EXPECTED_CERT_SHA256 must be a SHA-256 certificate fingerprint"
          }

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: apps/desktop/yarn.lock

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-desktop-windows-x64

      - name: Install pinned frontend dependencies
        working-directory: apps/desktop
        run: |
          npm install --global yarn@${{ env.YARN_VERSION }}
          yarn install --frozen-lockfile --non-interactive

      - name: Build unsigned Windows x64 NSIS and MSI
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis,msi -- --locked

      - name: Stage and validate exact unsigned Windows artifacts
        run: node scripts/release-artifacts.mjs stage-desktop windows dist-release

      - name: Refuse pre-signed Windows build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @(Get-ChildItem -LiteralPath dist-release -File | Where-Object { $_.Extension -in ".exe", ".msi" })
          if ($artifacts.Count -ne 3) {
            throw "Expected exactly three unsigned Windows artifacts, found $($artifacts.Count)"
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne "NotSigned" -or $null -ne $signature.SignerCertificate) {
              throw "Build job must emit unsigned artifacts: $($artifact.Name) ($($signature.Status))"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64-unsigned
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign and verify Windows x64 artifacts
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release-signing
    env:
      RELEASE_VERSION: ${{ needs.build-windows.outputs.release-version }}
      WINDOWS_EXPECTED_CERT_SHA256: ${{ vars.WINDOWS_EXPECTED_CERT_SHA256 }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
    steps:
      # Deliberately no checkout. The protected job receives only the exact
      # unsigned artifact set produced by the unprivileged build job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows-x64-unsigned
          path: dist-release

      - name: Validate exact unsigned Windows input set
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version from build job"
          }
          if ($env:RELEASE_REF_TYPE -eq "tag" -and $env:RELEASE_REF_NAME -ne "v$($env:RELEASE_VERSION)-desktop") {
            throw "Release tag does not match unsigned artifact version"
          }
          $expectedPin = ($env:WINDOWS_EXPECTED_CERT_SHA256 -replace "[^0-9A-Fa-f]", "").ToLowerInvariant()
          if ($expectedPin -notmatch '^[0-9a-f]{64}$') {
            throw "Repository variable WINDOWS_EXPECTED_CERT_SHA256 must be a SHA-256 certificate fingerprint"
          }

          $expectedNames = @(
            "hacash-wallet-desktop-v$($env:RELEASE_VERSION)-x64-setup.exe",
            "hacash-wallet-desktop-v$($env:RELEASE_VERSION)-x64.msi",
            "hacash-wallet-desktop-v$($env:RELEASE_VERSION)-x64-portable.exe"
          )
          $actualNames = @(Get-ChildItem -LiteralPath dist-release -File | ForEach-Object Name | Sort-Object)
          $actualList = [string]::Join([Environment]::NewLine, $actualNames)
          $expectedList = [string]::Join([Environment]::NewLine, @($expectedNames | Sort-Object))
          if ($actualList -ne $expectedList) {
            throw "Unexpected unsigned Windows artifact set: $($actualNames -join ', ')"
          }

          function Assert-Pe([string] $Path, [bool] $RequireX64) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Invalid PE file: $Path"
            }
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($offset -lt 0 -or $offset + 6 -gt $bytes.Length -or
                $bytes[$offset] -ne 0x50 -or $bytes[$offset + 1] -ne 0x45 -or
                $bytes[$offset + 2] -ne 0 -or $bytes[$offset + 3] -ne 0) {
              throw "Invalid PE header: $Path"
            }
            if ($RequireX64 -and [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) {
              throw "Portable executable is not Windows x64: $Path"
            }
          }
          function Assert-Msi([string] $Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 8 -or
                [Convert]::ToHexString($bytes[0..7]).ToLowerInvariant() -ne "d0cf11e0a1b11ae1") {
              throw "Invalid MSI/OLE file: $Path"
            }
          }

          Assert-Pe (Join-Path dist-release $expectedNames[0]) $false
          Assert-Msi (Join-Path dist-release $expectedNames[1])
          Assert-Pe (Join-Path dist-release $expectedNames[2]) $true
          foreach ($name in $expectedNames) {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path dist-release $name)
            if ($signature.Status -ne "NotSigned" -or $null -ne $signature.SignerCertificate) {
              throw "Signing job input is already signed: $name ($($signature.Status))"
            }
          }

      - name: Sign and verify with the protected Authenticode key
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "hacash-wallet-release.pfx"
          $collection = $null
          try {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
                [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw "Both Windows release-signing secrets are required"
            }
            try {
              $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            } catch {
              throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64"
            }
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
            if ((Get-Item -LiteralPath $pfxPath).Length -lt 512) {
              throw "Windows signing certificate is unexpectedly small"
            }

            $collection = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $collection.Import(
              $pfxPath,
              $env:WINDOWS_CERTIFICATE_PASSWORD,
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            $signers = @($collection | Where-Object {
              $_.HasPrivateKey -and
              @($_.EnhancedKeyUsageList | Where-Object { $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3" }).Count -eq 1
            })
            if ($signers.Count -ne 1) {
              throw "Expected exactly one private certificate valid for code signing"
            }
            $certificate = $signers[0]
            $now = [DateTime]::UtcNow
            if ($certificate.NotBefore.ToUniversalTime() -gt $now -or
                $certificate.NotAfter.ToUniversalTime() -lt $now.AddDays(7)) {
              throw "The Windows signing certificate is not valid for the release window"
            }
            $expected = ($env:WINDOWS_EXPECTED_CERT_SHA256 -replace "[^0-9A-Fa-f]", "").ToLowerInvariant()
            $actual = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($certificate.RawData)
            ).ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "The protected key does not match WINDOWS_EXPECTED_CERT_SHA256"
            }

            $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
            if (-not $signTool) {
              $candidates = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending)
              if ($candidates.Count -eq 0) { throw "signtool.exe was not found" }
              $signTool = $candidates[0].FullName
            }

            $artifacts = @(Get-ChildItem -LiteralPath dist-release -File | Sort-Object Name)
            foreach ($artifact in $artifacts) {
              & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $artifact.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($artifact.Name)" }
            }
            foreach ($artifact in $artifacts) {
              & $signTool verify /pa /all $artifact.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $($artifact.Name)" }
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
              if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
                throw "Invalid Authenticode signature: $($artifact.Name) ($($signature.Status))"
              }
              $signer = [Convert]::ToHexString(
                [Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)
              ).ToLowerInvariant()
              if ($signer -ne $expected) {
                throw "Unexpected Authenticode signer: $($artifact.Name)"
              }
            }
          } finally {
            if ($null -ne $collection) {
              foreach ($certificate in $collection) { $certificate.Dispose() }
              $collection.Clear()
            }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux x64 packages and binary
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify release version and tag
        run: node scripts/release-version.mjs check

      - name: Checkout pinned fullnodedev
        shell: pwsh
        run: ./scripts/checkout-fullnode.ps1

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libfuse2 file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: apps/desktop/yarn.lock

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-desktop-linux-x64

      - name: Install pinned frontend dependencies
        working-directory: apps/desktop
        run: |
          npm install --global yarn@${YARN_VERSION}
          yarn install --frozen-lockfile --non-interactive

      - name: Build Linux x64 deb and AppImage
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles deb,appimage -- --locked

      - name: Stage and validate exact Linux artifacts
        run: |
          node scripts/release-artifacts.mjs stage-desktop linux dist-release
          test "$(dpkg-deb -f dist-release/hacash-wallet-desktop-v*-x64.deb Architecture)" = "amd64"
          file dist-release/hacash-wallet-desktop-v*-x64.AppImage | grep -F "x86-64"
          file dist-release/hacash-wallet-desktop-v*-x64-portable | grep -F "x86-64"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete desktop release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sign-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REQUESTED_CUSTODY_CLASS: ${{ vars.RELEASE_CUSTODY_CLASS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify release version and tag
        run: node scripts/release-version.mjs check

      - name: Refuse a high-value custody attestation
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED_CUSTODY_CLASS:-standard-outer-signed}"
          if [[ "$requested" != "standard-outer-signed" ]]; then
            echo "This PFX workflow signs outer artifacts only; custody class '$requested' is forbidden." >&2
            echo "Use the documented Tauri-integrated non-exportable remote/HSM signer first." >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-x64
          path: dist-release
          merge-multiple: true

      - name: Verify complete release and generate checksums
        run: node scripts/release-artifacts.mjs verify-desktop dist-release

      - name: Attest verified desktop release provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist-release/*

      - name: Publish only the verified complete artifact set
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: dist-release/*
          body: |
            ### Hacash Wallet Desktop ${{ github.ref_name }}

            Windows x64:
            - NSIS setup executable
            - MSI installer
            - Portable executable

            Windows Authenticode covers the three downloadable files. This outer-signing
            release profile is not a high-value or hardware-grade custody attestation.

            Linux x64:
            - Debian package
            - AppImage
            - AppImage is the portable Linux option
            - Raw x64 binary (requires compatible GTK 3, WebKitGTK 4.1 and system libraries)

            A SHA-256 checksum file is included with all desktop artifacts.
