[package]
name = "wallet-tauri-common"
version.workspace = true
edition.workspace = true
description = "Shared Tauri IPC commands for HPAY Wallet (desktop + mobile)"
license.workspace = true

[dependencies]
hacash-wallet-core = { path = "../wallet-core" }
tauri = { version = "2", features = ["unstable"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zeroize.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true }
dust-whisper = { path = "../dust-whisper", optional = true }

sha2.workspace = true
dirs.workspace = true
# The supervised node's own lock file. Holding it is the one thing only a live
# process can do, which is what makes the claim file beside it mean anything: a
# pid on its own is worthless because pids are recycled.
fs2.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
agent-wallet-core = { path = "../agent-wallet-core", optional = true }
# Read only, and only two things: the fullnode query that reports a registry
# channel's own storage lease, and the measured readiness of the user side of
# the unilateral exit. No Hub is started, no Hub state is touched, and no Hub
# endpoint is called from this crate. agent-wallet-core already depends on it,
# so this adds no compilation unit; it exists so the exit gate the desktop
# renders is the project's own measurement rather than a literal typed here.
l2-fast-pay-hub = { path = "../l2-fast-pay-hub", optional = true }
agent-wallet-runtime = { path = "../agent-wallet-runtime", optional = true, features = ["listener"] }
hpay-agent-connector = { path = "../agent-connector", optional = true, default-features = false }
hpay-companion-protocol = { path = "../companion-protocol", optional = true }
hpay-companion-lan-runtime = { path = "../companion-lan-runtime", optional = true }

[target.'cfg(unix)'.dependencies]
# The graceful half of stopping the supervised node.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows has no SIGTERM, and the node's only clean exit is its Ctrl+C handler.
# The wallet is a `windows_subsystem = "windows"` binary with no console of its
# own, so a clean stop needs the AttachConsole / GenerateConsoleCtrlEvent /
# FreeConsole dance against the child's own process group.
#
# Win32_NetworkManagement_IpHelper is the answer to "who actually holds the API
# port right now". The node announcing `[Api Server] listening on ...` is not
# proof it is still bound: server.rs can lose that thread while the chain and
# p2p threads carry on, and a stranger can then take the port. Asking the
# kernel for the owning pid of the listening socket and comparing it to the
# child's own pid is the only thing that turns "something answers" into "our
# node answers".
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_NetworkManagement_IpHelper",
] }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The mock runtime, so a test can build a real Tauri application with a real
# managed `AppState` and enter a command through IPC, exactly where a press
# enters it. Without it there is no way to obtain a `tauri::State` at all, and
# the only entrance left is the crate helper underneath the command, which is
# not the thing a person runs.
tauri = { version = "2", features = ["unstable", "test"] }
# The relay's own wire types, so the recorder in
# `messenger_two_wallets_one_relay.rs` reads the envelope a relay operator
# would hold rather than a re-encoding of it.
dust-whisper = { path = "../dust-whisper" }
# So an attack fixture can stamp an envelope with the time it is really posting
# it. The relay refuses one whose signed timestamp is outside its freshness
# window, which is what bounds how long copied bytes stay replayable.
chrono = { workspace = true }
# The fullnode's own in-memory chain and the contract types that read it. Same
# dependency, and for the same reason, as `wallet-core`'s on-chain exit proofs:
# it is how the bytes this crate's own command produces get executed by the
# real block executor against real HVM contract state, rather than asserted
# about against a hand-built snapshot.
testkit = { path = "../../../hacash-fullnodedev/testkit" }
vm = { path = "../../../hacash-fullnodedev/vm" }
field = { path = "../../../hacash-fullnodedev/field" }
sys = { path = "../../../hacash-fullnodedev/sys" }
protocol = { path = "../../../hacash-fullnodedev/protocol" }
# The transaction trait, so the fullnode double in `registry_channel_press.rs`
# derives a submitted transaction's hash with the chain's own codec rather than
# being told what it is.
basis = { path = "../../../hacash-fullnodedev/basis" }

[features]
default = []
desktop = ["dep:dust-whisper"]
desktop-platform = []
agent-wallet-testnet-pilot = [
    "agent-wallet-admin",
    "agent-wallet-core/agent-wallet-testnet-pilot",
    "hpay-companion-protocol/agent-wallet-testnet-pilot",
]
# Brings the Hub crate's registry deployment / init / funding builders into the
# graph so the *command an owner presses* can be proven against a real deployed
# contract in real blocks. Test-only in practice - nothing in this crate's own
# source is gated on it - and it cannot live in `[dev-dependencies]` because
# the feature belongs to a normal dependency.
on-chain-exit-proof = [
    "agent-wallet-testnet-pilot",
    "l2-fast-pay-hub/local-pilot-tools",
    "agent-wallet-core/on-chain-exit-proof",
]
agent-wallet-bounded-mainnet-pilot = [
    "agent-wallet-testnet-pilot",
    "agent-wallet-core/agent-wallet-bounded-mainnet-pilot",
]
agent-wallet-admin = [    "dep:agent-wallet-core",
    "dep:l2-fast-pay-hub",
    "dep:agent-wallet-runtime",
    "dep:hpay-agent-connector",
    "dep:hpay-companion-protocol",
    "dep:hpay-companion-lan-runtime",
]
