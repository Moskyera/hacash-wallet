[package]
name = "hacash-wallet-core"
version.workspace = true
edition.workspace = true
description = "Secure HPAY wallet core for Hacash: vault, signing, L1/L2 payment routing"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
zeroize.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
hex.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
chrono.workspace = true
uuid = { version = "1", features = ["v4"] }
dirs.workspace = true
tracing.workspace = true
base64.workspace = true
sha2.workspace = true
hkdf.workspace = true
fs2.workspace = true
secp256k1.workspace = true
url.workspace = true
p256.workspace = true
coset.workspace = true
dust-whisper = { path = "../dust-whisper" }
l2-fast-pay-hub = { path = "../l2-fast-pay-hub" }
sys = { path = "../../../hacash-fullnodedev/sys" }
field = { path = "../../../hacash-fullnodedev/field" }
basis = { path = "../../../hacash-fullnodedev/basis" }
protocol = { path = "../../../hacash-fullnodedev/protocol" }
mint = { path = "../../../hacash-fullnodedev/mint" }
vm = { path = "../../../hacash-fullnodedev/vm" }
sdk = { path = "../../../hacash-fullnodedev/sdk" }

[features]
default = []
# Builds the Hub's witness service into the dependency graph so the
# counterparty rollback-anchor ratchet can be proven against a real witness,
# a real Hub and real HTTP rather than against minted receipts. Test-only in
# practice: nothing in this crate's own source is gated on it. It cannot live
# in `[dev-dependencies]` because the feature belongs to a normal dependency.
rollback-witness = ["l2-fast-pay-hub/rollback-witness"]
# Brings the Hub crate's registry deployment / init / funding builders into the
# graph so the user-side exit driver can be proven against a real deployed
# contract in real blocks, rather than against a hand-built snapshot. Test-only
# in practice - nothing in this crate's own source is gated on it - and it
# cannot live in `[dev-dependencies]` for the same reason `rollback-witness`
# cannot: the feature belongs to a normal dependency.
on-chain-exit-proof = ["l2-fast-pay-hub/local-pilot-tools"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
# The fullnode's own in-memory chain, exactly as the Hub crate uses it and for
# exactly the same reason: it is how the wallet's own signed exit bytes get
# executed by the real block executor against real HVM contract state instead
# of being asserted about in a unit test.
testkit = { path = "../../../hacash-fullnodedev/testkit" }