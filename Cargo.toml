[workspace]
resolver = "2"
members = [
    "crates/agent-connector",
    "crates/agent-types",
    "crates/agent-wallet-core",
    "crates/agent-wallet-runtime",
    "crates/companion-protocol",
    "crates/companion-lan-runtime",
    "crates/dust-whisper",
    "crates/l2-fast-pay-hub",
    "crates/wallet-core",
    "crates/wallet-tauri-common",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
coset = "0.3"
proptest = "1"
secp256k1 = "0.31.1"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
fs2 = "0.4"
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }

# Tauri 2 on Linux is pinned to GTK3/glib 0.18. The registry release contains
# RUSTSEC-2024-0429 and no 0.18.6 was published. Pin the reviewed two-line
# upstream backport so optimized Linux builds do not retain the VariantStrIter
# undefined behaviour. Retire this patch when Tauri moves to a fixed glib line.
[patch.crates-io]
glib = { git = "https://github.com/jcfs/gtk-rs-core.git", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-macros = { git = "https://github.com/jcfs/gtk-rs-core.git", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
glib-sys = { git = "https://github.com/jcfs/gtk-rs-core.git", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
gobject-sys = { git = "https://github.com/jcfs/gtk-rs-core.git", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
